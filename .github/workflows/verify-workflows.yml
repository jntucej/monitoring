name: Verify Workflows
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:17.6.1.136
        # supabase/postgres (NixOS variant) quirks:
        #  1. Its entrypoint wrapper mis-parses any `command:` override, so
        #     POSTGRES_USER cannot be swapped in the service env.
        #  2. The built-in init hook (migrate.sh) hardcodes supabase_admin,
        #     which the image always creates — so we keep the service env as
        #     the image default and connect as supabase_admin instead.
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: ci_dummy_postgres_password_123
          POSTGRES_DB: gate_monitor
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Bootstrap DB
        env:
          # The supabase/postgres image bootstraps the POSTGRES_USER role
          # (supabase_admin here) with the known POSTGRES_PASSWORD and gives
          # it ownership of public, so schema DDL resolves in its context.
          DATABASE_URL: postgres://supabase_admin:ci_dummy_postgres_password_123@localhost:5432/gate_monitor
        run: |
          # supabase_admin is not the DB superuser (the image creates a
          # `postgres` superuser with an unknown password); grant it DDL
          # rights on public so schema.sql CREATE statements succeed.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=0 \
            -c "GRANT CREATE, USAGE ON SCHEMA public TO supabase_admin;" || true
          psql "$DATABASE_URL" -v ON_ERROR_STOP=0 \
            -c "GRANT ALL ON DATABASE gate_monitor TO supabase_admin;" || true
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/schema.sql
          # NOTE: do NOT run database/bootstrap.sql here. Its strict
          # schema_migrations (NOT NULL filename/checksum) would clash with
          # the looser shape check-migrations.sh expects and create; check-
          # migrations.sh is self-sufficient (creates its own schema_migrations
          # + Supabase-compat roles) and only needs schema.sql loaded.
      - name: Apply migrations
        env:
          # Same postgres role as the Bootstrap step. check-migrations.sh
          # now grants DDL rights to the connecting role dynamically.
          DATABASE_URL: postgres://supabase_admin:ci_dummy_postgres_password_123@localhost:5432/gate_monitor
        run: bash scripts/check-migrations.sh
      - name: Role → workflow consistency
        run: npx tsx scripts/check-role-workflow.ts
      - name: Permission workflow unit tests
        run: npx tsx scripts/verify-permission-workflow.ts
      - name: Admin independence
        run: bash scripts/check-admin-independence.sh
      - name: Principal independence
        run: bash scripts/check-principal-independence.sh
      - name: TypeScript
        run: npm run typecheck
