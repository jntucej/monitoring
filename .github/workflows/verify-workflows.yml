name: Verify Workflows
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:17.6.1.136
        env:
          POSTGRES_PASSWORD: ci_dummy_postgres_password_123
          POSTGRES_DB: gate_monitor
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Bootstrap DB
        env:
          DATABASE_URL: postgres://postgres:ci_dummy_postgres_password_123@localhost:5432/gate_monitor
        run: |
          psql "$DATABASE_URL" -f database/schema.sql
          # NOTE: do NOT run database/bootstrap.sql here. Its strict
          # schema_migrations (NOT NULL filename/checksum) would clash with
          # the looser shape check-migrations.sh expects and create; check-
          # migrations.sh is self-sufficient (creates its own schema_migrations
          # + Supabase-compat roles) and only needs schema.sql loaded.
      - name: Apply migrations
        env:
          DATABASE_URL: postgres://postgres:ci_dummy_postgres_password_123@localhost:5432/gate_monitor
        run: bash scripts/check-migrations.sh
      - name: Role → workflow consistency
        run: npx tsx scripts/check-role-workflow.ts
      - name: Permission workflow unit tests
        run: npx tsx scripts/verify-permission-workflow.ts
      - name: Admin independence
        run: bash scripts/check-admin-independence.sh
      - name: Principal independence
        run: bash scripts/check-principal-independence.sh
      - name: TypeScript
        run: npm run typecheck
