name: Verify Workflows
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:17.6.1.136
        env:
          POSTGRES_PASSWORD: ci_dummy_postgres_password_123
          POSTGRES_DB: gate_monitor
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Bootstrap DB
        env:
          # Supabase/Neon postgres image: the `postgres` role is the only role
          # whose password is known (POSTGRES_PASSWORD). The `public` schema
          # is owned by `supabase_admin` (unknown generated password), so a
          # bare `postgres` user lacks CREATE on public. The bootstrap step
          # below grants postgres DDL rights on public + auth before loading
          # schema.sql; the check-migrations.sh bootstrap block does the same
          # grant idempotently for the migration replay step.
          DATABASE_URL: postgres://postgres:***@localhost:5432/gate_monitor
        run: |
          # Grant postgres full DDL rights on public so schema.sql CREATE
          # statements succeed. Tolerate errors on a fresh DB where some
          # objects may not exist yet (ON_ERROR_STOP=0).
          psql "$DATABASE_URL" -v ON_ERROR_STOP=0 \
            -c "GRANT CREATE, USAGE ON SCHEMA public TO postgres;" || true
          psql "$DATABASE_URL" -v ON_ERROR_STOP=0 \
            -c "GRANT ALL ON DATABASE gate_monitor TO postgres;" || true
          psql "$DATABASE_URL" -f database/schema.sql
          # NOTE: do NOT run database/bootstrap.sql here. Its strict
          # schema_migrations (NOT NULL filename/checksum) would clash with
          # the looser shape check-migrations.sh expects and create; check-
          # migrations.sh is self-sufficient (creates its own schema_migrations
          # + Supabase-compat roles) and only needs schema.sql loaded.
      - name: Apply migrations
        env:
          # Same postgres role as the Bootstrap step. check-migrations.sh
          # now grants DDL rights to the connecting role dynamically.
          DATABASE_URL: postgres://postgres:***@localhost:5432/gate_monitor
        run: bash scripts/check-migrations.sh
      - name: Role → workflow consistency
        run: npx tsx scripts/check-role-workflow.ts
      - name: Permission workflow unit tests
        run: npx tsx scripts/verify-permission-workflow.ts
      - name: Admin independence
        run: bash scripts/check-admin-independence.sh
      - name: Principal independence
        run: bash scripts/check-principal-independence.sh
      - name: TypeScript
        run: npm run typecheck
