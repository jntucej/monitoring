name: Infrastructure

# Compose boot test, performance budget, console independence checks.
# Runs on changes to docker-compose.yml, Dockerfile, scripts/*.sh, Caddyfile.
# Owned by: infrastructure team. See docs/WORKFLOW-ARCHITECTURE.md.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'docker-compose.yml'
      - 'Dockerfile'
      - 'scripts/*.sh'
      - 'Caddyfile'
      - '.github/CODEOWNERS'
      - '.github/workflows/infrastructure.yml'

concurrency:
  group: infrastructure-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compose-boot:
    name: Docker Compose Boot Test
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci_dummy_postgres_password_123
      REDIS_PASSWORD: ci_dummy_redis_password_123
      CRON_SECRET: ci_dummy_cron_secret_123
      CLOUDFLARE_TUNNEL_TOKEN: ci_dummy_tunnel_token
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate docker-compose syntax
        run: docker compose config --quiet && echo "compose syntax OK"

      - name: Shell-check deploy scripts
        run: |
          bash -n scripts/03-deploy.sh
          bash -n scripts/verify-deploy.sh
          echo "scripts OK"

      - name: Boot postgres + redis
        run: docker compose up -d --build postgres redis

      - name: Wait for health checks
        run: |
          for i in $(seq 1 12); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' gate_postgres 2>/dev/null || echo "unknown")
            [ "$STATUS" = "healthy" ] && echo "postgres healthy" && break
            echo "attempt $i/12: postgres=$STATUS"
            sleep 10
          done
          docker inspect --format='{{.State.Health.Status}}' gate_postgres | grep -q healthy

      - name: Check container status
        if: always()
        run: |
          docker compose ps
          CRASHED=$(docker ps -a --filter "status=exited" --format "{{.Names}}")
          if [ -n "$CRASHED" ]; then
            echo "GUARDRAIL ALERT: crashed on boot: $CRASHED"
            docker compose logs
            exit 1
          fi
          echo "All booted containers healthy."

      - name: Teardown
        if: always()
        run: docker compose down -v

  performance:
    name: Performance Budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Enforce first-load performance budget
        env:
          KIOSK_SESSION_REQUIRE_PIN: "true"
        run: bash scripts/verify-no-heavy-first-load.sh

  console-independence:
    name: Console Independence Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Admin independence
        run: bash scripts/check-admin-independence.sh
      - name: Principal independence
        run: bash scripts/check-principal-independence.sh
