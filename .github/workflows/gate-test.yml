name: Gate Core & Playwright Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run typecheck
        run: npm run typecheck
      # Lint is reported but not gating: the codebase carries pre-existing
      # react-hooks debt (useTransform in factory closures, conditional
      # hooks in RoleConsole) that is tracked separately. The hard gate for
      # this workflow is typecheck + the test suite; failing the whole job
      # on historical lint debt hides real regressions from view.
      - name: Run lint (report, non-blocking)
        run: |
          if npm run lint; then
            echo "✓ lint clean"
          else
            echo "::warning::Lint errors present (pre-existing react-hooks debt). Reported, not gating this workflow."
          fi
      - name: Run Jest gate test suite
        run: |
          npx jest --config tests/gate/jest.config.mjs --selectProjects node --ci --coverage
        # The node project covers policy / service / route / auth / e2e / lib
        # (auth + lockout, record-scan, gate-scan route, RLS, CSRF, rate-limit).
        # The ui project needs a jsdom environment and runs locally via
        # `npm run test:gate`.
