name: Branch name guard

# Enforces the branching convention in docs/BRANCHING.md / CONTRIBUTING.md.
# GitHub Free does not enforce branch protection on private repos, so this
# CI check is the enforcement. Team rule: never merge a PR with a red check.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  check-name:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ ! "$HEAD_REF" =~ ^(feature|bugfix|hotfix|infra|test)/[A-Za-z0-9._-]+ ]]; then
            echo "::error::Branch name '$HEAD_REF' must be <type>/<ticket>-<slug>, type = feature|bugfix|hotfix|infra|test"
            exit 1
          fi
          echo "Branch name '$HEAD_REF' OK"