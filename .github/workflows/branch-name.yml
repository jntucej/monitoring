name: Branch name guard

# Enforces branching convention docs/BRANCHING.md / CONTRIBUTING.md.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  check-name:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "Branch name: $HEAD_REF"
          echo "Branch name check passed."
