name: Deploy

# Single deployment entry point. Replaces:
#   - deploy.yml (auto on push)
#   - manual-deploy.yml (manual dispatch)
#   - telegram-deploy.yml (Telegram-triggered)
#
# Production is protected by a GitHub Environment with required reviewers.
# Concurrency group prevents parallel deploys.
# Owned by: platform team. See docs/WORKFLOW-ARCHITECTURE.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://monitor.ucej.in
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Pre-deploy health check
        id: health
        run: |
          echo "=== Pre-Deploy Check ==="
          SSH_HOST="${{ secrets.SERVER_HOST }}"
          SSH_USER="${{ secrets.SERVER_USER }}"
          SSH_KEY="/tmp/.github/ssh-key"
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > "$SSH_KEY" && chmod 600 "$SSH_KEY"

          if ssh -o ConnectTimeout=15 -o StrictHostKeyChecking=no -i "$SSH_KEY" "${SSH_USER}@${SSH_HOST}" "echo OK" 2>/dev/null; then
            echo "SSH Connectivity: OK"
            echo "SSH_STATUS=working" >> $GITHUB_OUTPUT
          else
            echo "SSH Connectivity: FAILED"
            echo "SSH_STATUS=failed" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to server
        if: steps.health.outputs.SSH_STATUS == 'working'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/monitoring/compose
            git fetch origin
            git reset --hard origin/main
            rsync -av --delete \
              --exclude='.git' --exclude='node_modules' --exclude='.next' \
              --exclude='.env' --exclude='.env.*' \
              src/ /opt/monitoring/compose/src/
            rsync -av --delete \
              --exclude='.git' \
              database/migrations/ /opt/monitoring/compose/database/migrations/
            docker compose build web --no-cache
            docker compose up -d --remove-orphans
            for i in $(seq 1 20); do
              STATUS=$(docker inspect --format="{{.State.Health.Status}}" gate_web 2>/dev/null || echo "missing")
              if [ "$STATUS" = "healthy" ]; then
                echo "Container is healthy!"
                break
              fi
              echo "Waiting... ($i/20)"
              sleep 5
            done
            docker logs gate_web --tail 10

      - name: Post-deploy verification
        if: success()
        run: echo "Deployment complete"

      - name: Notify
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            Deploy to Production
            Commit: ${{ github.sha }}
            By: ${{ github.actor }}
            Status: ${{ job.status == 'success' && 'Success' || 'Failed' }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
