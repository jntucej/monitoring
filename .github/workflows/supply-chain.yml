name: supply-chain

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  id-token: write          # required for Sigstore keyless OIDC
  attestations: write

jobs:
  build-sign-attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }

      - run: npm ci --ignore-scripts    # ignore-scripts blocks postinstall malware

      # 1. Generate SBOM at build time (CycloneDX format)
      - name: Generate SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.cdx.json }

      # 2. Vulnerability scan; fail on high/critical
      - name: Audit CI
        run: npx --yes audit-ci

      # 3. Build the image
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runner
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ github.sha }}
          provenance: true         # SLSA provenance attestation

      # 4. Sign the image keyless with Cosign (OIDC identity, no long-lived key)
      - uses: sigstore/cosign-installer@v3
      - name: Sign image
        run: cosign sign --yes ghcr.io/${{ github.repository }}/web:${{ github.sha }}

      # 5. Attach the SBOM to the image so consumers can verify
      - name: Attach SBOM
        run: |
          cosign attach sbom --sbom sbom.cdx.json ghcr.io/${{ github.repository }}/web:${{ github.sha }}
          cosign attest --yes --predicate sbom.cdx.json --type cyclonedx \
               ghcr.io/${{ github.repository }}/web:${{ github.sha }}
