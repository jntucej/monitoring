name: QA Evidence

# Saves QA evidence as a workflow artifact on every PR, and posts a sticky
# comment linking to it so the reviewer can find it before approving.
# See docs/GITHUB_FREE_SETUP.md for the 500 MB / 30-day policy.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  actions: write        # upload-artifact@v4 needs it when the org default is restrictive;
                        # a permissions: block sets every unlisted scope to none

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run QA tests
        run: |
          mkdir -p qa-evidence/screenshots
          mkdir -p qa-evidence/reports
          # ponytail: no playwright.config.* or *.spec.ts exists yet, so
          # `npx playwright test` would error and make every PR red. Run it
          # only once tests exist; drop the guard when they land.
          # `find` not `**/*.spec.ts` — globstar is bash 4+ and breaks on macOS 3.2.
          if [ -n "$(find . -path ./node_modules -prune -o -name '*.spec.ts' -print -quit 2>/dev/null)" ]; then
            npx playwright install --with-deps chromium
            # Write evidence into qa-evidence/ explicitly. Playwright's default
            # outputs go to test-results/ and playwright-report/, which this
            # workflow does NOT upload — so without these flags the artifact
            # would be an empty zip the reviewer approves against.
            # --output      -> traces, screenshots, videos
            # junit reporter -> machine-readable test report
            npx playwright test \
              --output=qa-evidence/screenshots \
              --reporter=list,junit \
              --trace=retain-on-failure \
              || true
            # junit reporter writes junit.xml to the repo root by default; move
            # it next to the traces so both land in the uploaded artifact.
            # Don't fail the job, but don't hide it either — a missing XML means
            # the artifact shipped without its machine-readable report.
            mv junit.xml qa-evidence/reports/ 2>/dev/null \
              || echo "::warning::junit.xml not produced — QA artifact will lack the XML report"
            # html report is gitignored + bulky; keep the XML + traces only.
          else
            echo "No Playwright specs found — recording placeholder evidence."
            echo "No specs yet (branch: ${{ github.head_ref }})" > qa-evidence/reports/README.txt
          fi
          echo "Evidence written to qa-evidence/ on the workflow run." > qa-evidence/INDEX.txt

      - name: Upload QA evidence
        if: always()   # uploads even if tests fail — that is when evidence matters most
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence-pr-${{ github.event.pull_request.number }}
          path: qa-evidence/
          retention-days: 30   # keep short to stay under the 500 MB org cap

      - name: Comment artifact link on PR
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: QA Evidence
          message: |
            🧪 **QA Evidence**
            Download from the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
            Artifact: `qa-evidence-pr-${{ github.event.pull_request.number }}` (retained 30 days)