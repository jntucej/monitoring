name: Telegram Triggered Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'deploy | heal | retry'
        required: true
        default: 'deploy'
        type: choice
        options:
        - deploy
        - heal
        - retry

jobs:
  deploy:
    if: github.event.inputs.action == 'deploy' || github.event.inputs.action == 'retry'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Pre-deploy Health Check
      id: health
      run: |
        echo "=== Pre-Deploy Check ==="
        
        SSH_HOST=$(gh secret get SERVER_HOST --repo jntucej/monitoring 2>/dev/null || echo "192.168.1.36")
        SSH_KEY="/tmp/.github/ssh-key"
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > "$SSH_KEY" 2>/dev/null && chmod 600 "$SSH_KEY" || true
        
        # Test SSH
        if ssh -o ConnectTimeout=15 -o StrictHostKeyChecking=no -i "$SSH_KEY" root@"$SSH_HOST" "echo OK" 2>/dev/null; then
          echo "SSH Connectivity: ✅ Working"
          echo "SSH_STATUS=working" >> $GITHUB_OUTPUT
          
          # Check Docker
          DOCKER=$(ssh -o ConnectTimeout=10 -i "$SSH_KEY" root@"$SSH_HOST" "docker ps --filter name=gate --format '{{.Status}}' 2>/dev/null | head -1" || echo "unknown")
          echo "Docker Status: ✅ $DOCKER"
          echo "DOCKER_STATUS=$DOCKER" >> $GITHUB_OUTPUT
        else
          echo "SSH Connectivity: ❌ FAILED"
          echo "SSH_STATUS=failed" >> $GITHUB_OUTPUT
          echo "ERROR=SSH connection failed" >> $GITHUB_ENV
        fi
        
    - name: Deploy to Server
      if: steps.health.outputs.SSH_STATUS == 'working'
      run: |
        SSH_HOST=$(gh secret get SERVER_HOST --repo jntucej/monitoring 2>/dev/null || echo "192.168.1.36")
        SSH_KEY="/tmp/.github/ssh-key"
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > "$SSH_KEY" 2>/dev/null && chmod 600 "$SSH_KEY" || true
        
        echo "=== Deploying ==="
        ssh -o ConnectTimeout=300 -i "$SSH_KEY" root@"$SSH_HOST" "
          cd /opt/monitoring/compose
          git fetch origin
          git reset --hard origin/main
          rsync -av --delete \
            --exclude='.git' --exclude='node_modules' --exclude='.next' \
            --exclude='.env' --exclude='.env.*' \
            src/ /opt/monitoring/compose/src/
          docker compose build web --no-cache
          docker compose up -d --remove-orphans
          
          echo 'Waiting for healthy...'
          for i in \$(seq 1 30); do
            STATUS=\$(docker inspect --format='{{.State.Health.Status}}' gate_web 2>/dev/null || echo 'missing')
            if [ \"\$STATUS\" = 'healthy' ]; then
              echo 'Container is healthy!'
              break
            fi
            sleep 5
          done
          
          docker logs gate_web --tail 5
        "
        
    - name: Post-deploy Verification
      if: success()
      run: |
        echo "=== Deployment Complete ==="
        echo "✅ Deployed successfully"
        
    - name: Notify Success
      if: success()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          ✅ Deploy Success
          Action: ${{ github.event.inputs.action }}
          By: ${{ github.actor }}
          Run: #${{ github.run_id }}
          
          🔗 https://github.com/jntucej/monitoring/actions/runs/${{ github.run_id }}
          
    - name: Notify Failure
      if: failure()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          ❌ Deploy Failed
          Action: ${{ github.event.inputs.action }}
          By: ${{ github.actor }}
          Run: #${{ github.run_id }}
          
          To fix, run: /heal
          Or visit: https://github.com/jntucej/monitoring/actions/runs/${{ github.run_id }}

  heal:
    if: github.event.inputs.action == 'heal'
    runs-on: ubuntu-latest
    steps:
    - name: Diagnose and Fix
      run: |
        echo "=== Auto-Heal Agent ==="
        
        SSH_HOST=$(gh secret get SERVER_HOST --repo jntucej/monitoring 2>/dev/null || echo "192.168.1.36")
        SSH_KEY="/tmp/.github/ssh-key"
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > "$SSH_KEY" 2>/dev/null && chmod 600 "$SSH_KEY" || true
        
        DIAGNOSIS=""
        FIXES=""
        
        # Test SSH
        if ssh -o ConnectTimeout=15 -o StrictHostKeyChecking=no -i "$SSH_KEY" root@"$SSH_HOST" "echo OK" 2>/dev/null; then
          DIAGNOSIS="✅ SSH: Working"
          
          # Check Tailscale Funnel
          FUNNEL=$(ssh -o ConnectTimeout=10 -i "$SSH_KEY" root@"$SSH_HOST" "tailscale funnel status 2>&1" || echo "")
          if echo "$FUNNEL" | grep -q "No serve config"; then
            echo "Enabling Tailscale Funnel..."
            ssh -o ConnectTimeout=30 -i "$SSH_KEY" root@"$SSH_HOST" "tailscale funnel --tcp 22" 2>&1 || true
            FIXES="$FIXES\n- Enabled Tailscale Funnel"
          else
            DIAGNOSIS="$DIAGNOSIS\n✅ Funnel: Active"
          fi
          
          # Check Docker
          DOCKER=$(ssh -o ConnectTimeout=10 -i "$SSH_KEY" root@"$SSH_HOST" "docker ps --filter name=gate --format '{{.Status}}' 2>/dev/null | head -1" || echo "unknown")
          DIAGNOSIS="$DIAGNOSIS\n✅ Docker: $DOCKER"
        else
          DIAGNOSIS="❌ SSH: Failed"
          FIXES="$FIXES\n1. Check server is running\n2. Verify Tailscale is connected\n3. Check SSH key permissions"
        fi
        
        echo "DIAGNOSIS=$DIAGNOSIS" >> $GITHUB_ENV
        echo "FIXES=$FIXES" >> $GITHUB_ENV
        
    - name: Notify Heal Result
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          🤖 Auto-Heal Report
          
          === Diagnosis ===
          ${{ env.DIAGNOSIS }}
          
          === Fixes Applied ===
          ${{ env.FIXES }}
          
          Ready to deploy? Run: /deploy
