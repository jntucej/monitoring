name: Security

# Blocking: gitleaks secret scan, trivy npm dependency scan.
# Advisory: trivy container image scan, compose security, falco rules.
# Reports published only from this workflow (single source of truth).
# Owned by: security team. See docs/WORKFLOW-ARCHITECTURE.md.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Nightly scan of main (catches newly-published CVEs in pinned images)
    - cron: '17 3 * * *'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz
          chmod +x gitleaks

          cat > gitleaks-ci.toml <<'TOML'
          [extend]
          useDefault = true

          [allowlist]
          description = "CI allowlist: documented false positives only"
          paths = [
              '''^\.next/''',
              '''^\.env$''',
              '''^\.env\.local$''',
              '''^node_modules/''',
              '''^dist/''',
              '''^build/''',
              '''^repomix-output\.xml$''',
              '''^docs/repomix''',
              '''^scripts/seed-data\.js$''',
              '''^scripts/test-db\.js$''',
              '''^scripts/test-session-invalidation\.js$''',
              '''^tests/gate/lib/barcode\.test\.ts$''',
              '''^tests/gate/routes/verify-pass-route\.test\.ts$''',
              '''^\.continue/agents/new-config\.yaml$''',
              '''^src/lib/supabaseClient\.ts$''',
              '''^\.github/workflows/infrastructure\.yml$''',
              '''^README\.md$''',
              '''^release-evidence/''',
              '''^\.swarm/''',
              '''^\.swarm-parallel/''',
              '''^\.hermes/''',
              '''^\.github/skills/''',
              '''^tests/gate/coverage/'''
          ]
          regexes = [
              '''identificationMarks[12]''',
              '''AKIAIO...MPLE''',
              '''AKIAIOSFODNN7EXAMPLE_CANARY''',
              '''wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY_CANARY'''
          ]
          TOML

          set +e
          ./gitleaks detect --config gitleaks-ci.toml --no-git --redact --no-banner \
            --report-format json --report-path gitleaks-report.json > /dev/null 2>&1
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "gitleaks: working tree clean"
            exit 0
          fi

          node -e '
            const fs = require("fs");
            let r;
            try { r = JSON.parse(fs.readFileSync("gitleaks-report.json", "utf8")); }
            catch (e) { console.error("unreadable gitleaks report - failing closed"); process.exit(2); }
            if (!Array.isArray(r) || r.length === 0) {
              console.log("no findings outside the allowlist");
              process.exit(0);
            }
            r.forEach(l => console.log("LEAK: " + (l.File||"?") + ":" + (l.Line||"?") + " [" + (l.RuleID||"?") + "]"));
            process.exitCode = 1;
          '

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 7

  trivy-npm:
    name: Trivy - npm Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Trivy
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version

      - name: Scan package-lock.json
        run: |
          trivy fs --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            --no-progress --format table .

      - name: Upload trivy npm report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-npm
          path: |
            trivy-npm-report.json
          retention-days: 7

  trivy-images:
    name: Trivy - Container Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Trivy
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version

      - name: Scan external images
        run: |
          images=$(grep -oE 'image: [a-z0-9./:@-]+' docker-compose.yml \
            | awk '{print $2}' \
            | grep -vE '^(monitoring|gate_)' \
            | grep -v '^$' \
            | sort -u)
          echo "Scanning: $images"
          failures=0
          for img in $images; do
            echo "=== $img ==="
            trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
              --no-progress "$img" 2>/dev/null || failures=$((failures+1))
          done
          if [ "$failures" -gt 0 ]; then
            echo "::error::$failures image(s) have fixable HIGH/CRITICAL CVEs."
            exit 1
          fi

  compose-security:
    name: Compose Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install yq
        run: |
          wget -qO yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x yq
          sudo mv yq /usr/local/bin/

      - name: Check for :latest image tags
        run: |
          hits=$(grep -E 'image:.*:latest' docker-compose.yml | grep -v -E 'monitoring-(web|worker):latest' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Found :latest tag on a pulled image"
            exit 1
          fi
          echo "No :latest tags on pulled images."

      - name: Check for privileged containers
        run: |
          result=$(yq -r '.services | to_entries | map(select(.value.privileged == true and .key != "cadvisor" and .key != "falco")) | .[].key' docker-compose.yml 2>/dev/null)
          if [ -n "$result" ] && [ "$result" != "null" ]; then
            echo "::error::Privileged container(s): $result"
            exit 1
          fi
          echo "No unexpected privileged containers."

      - name: Check cap_drop on caddy/cloudflared/alertmanager
        run: |
          for svc in caddy cloudflared alertmanager; do
            cap_drop=$(yq ".services.${svc}.cap_drop" docker-compose.yml)
            if [ "$cap_drop" = "null" ] || [ -z "$cap_drop" ]; then
              echo "::error::Service '$svc' missing cap_drop"
              exit 1
            fi
          done
          echo "cap_drop present on caddy, cloudflared, alertmanager."

      - name: Check plaintext secrets in environment blocks
        run: |
          hits=$(yq '.services[].environment' docker-compose.yml 2>/dev/null \
            | grep -iE 'PASSWORD|SECRET|TOKEN|API_KEY' \
            | grep -vE ':-.*\}|\$\{')
          if [ -n "$hits" ]; then
            echo "::error::Plaintext secrets in environment blocks:"
            echo "$hits"
            exit 1
          fi
          echo "No plaintext secrets in environment blocks."

  falco-rules-check:
    name: Falco Rules Sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate falco-rules.yaml
        run: |
          if [ ! -f compose/security/falco-rules.yaml ]; then
            echo "::error::compose/security/falco-rules.yaml not found"
            exit 1
          fi
          python3 - <<'PY'
          import yaml, sys
          with open("compose/security/falco-rules.yaml") as f:
            data = yaml.safe_load(f)
          rules = []
          if isinstance(data, list):
            for item in data:
              if isinstance(item, dict) and 'rule' in item:
                rules.append(item['rule'])
          elif isinstance(data, dict):
            for r in (data.get('rules') or []):
              if isinstance(r, dict) and 'rule' in r:
                rules.append(r['rule'])
          required = {
              "Shell Spawned in Application Container",
              "Unexpected Outbound Connection from Web Container",
              "Sensitive File Access in Gate Containers",
          }
          missing = required - set(rules)
          if missing:
            print(f"::error::Missing required Falco rules: {missing}")
            sys.exit(1)
          print(f"OK - all {len(required)} required rules present ({len(rules)} total).")
          PY
