name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    name: Secret Detection (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        # gitleaks/gitleaks-action@v2 requires a paid GITLEAKS_LICENSE for
        # organisation repos. Run the gitleaks CLI directly instead — the
        # .gitleaks.toml config still applies; a non-zero exit code means
        # leaks were found and the job fails.
        run: |
          GL_VER=$(curl -sSfL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep -oP '"tag_name"\s*:\s*"v?\K[0-9.]+')
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VER}/gitleaks_${GL_VER}_linux_x64.tar.gz" | tar -xz
          chmod +x gitleaks
          ./gitleaks detect --config .gitleaks.toml --redact --no-banner -v \
            || { echo "gitleaks found secrets"; exit 1; }
