name: CI

# Blocking merge gate: build, typecheck, Jest + Playwright tests.
# Advisory: lint, unslop audit. Secret scanning lives in security.yml.
# Database gates (migrations, RLS) live in database.yml.
# Owned by: platform team. See docs/WORKFLOW-ARCHITECTURE.md.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Typecheck, Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci_dummy_postgres_password_123
          POSTGRES_DB: gate_monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Blocking: typecheck
      - name: Typecheck
        run: npm run typecheck

      # Advisory: lint (reported, non-blocking - pre-existing react-hooks debt)
      - name: Lint (advisory)
        run: |
          if npm run lint > /tmp/lint.log 2>&1; then
            echo "lint clean"
          else
            echo "::warning::Lint errors present (pre-existing debt)"
            echo "## Lint Report (advisory)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/lint.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      # Blocking: Jest gate test suite
      - name: Run Jest gate test suite
        env:
          DATABASE_URL: postgres://postgres:ci_dummy_postgres_password_123@localhost:5432/gate_monitor
        run: npx jest --config tests/gate/jest.config.mjs --selectProjects node --ci --coverage

      # Blocking: Playwright smoke
      - name: Run Playwright smoke tests
        env:
          DATABASE_URL: postgres://postgres:ci_dummy_postgres_password_123@localhost:5432/gate_monitor
        run: npx playwright test --config playwright.config.ts --project=chromium --grep @smoke

      # Advisory: unslop audit
      - name: Unslop UI audit (advisory)
        run: |
          if npx unslop-ui . --strict > /tmp/unslop.log 2>&1; then
            echo "unslop clean"
          else
            echo "::warning::Unslop findings (advisory)"
            cat /tmp/unslop.log
          fi

      # Evidence: upload test artifacts
      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-coverage
          path: tests/gate/coverage/
          retention-days: 7

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
