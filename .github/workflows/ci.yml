name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '26'

jobs:
  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --no-audit --no-fund --prefer-offline
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --no-audit --no-fund --prefer-offline
      - run: npm run lint

  env:
    name: Env Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --no-audit --no-fund --prefer-offline
      - name: Validate environment variables
        run: node scripts/validate-env.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          MFA_ENROLL_SECRET: ${{ secrets.MFA_ENROLL_SECRET }}
          TOTP_ENCRYPTION_KEY: ${{ secrets.TOTP_ENCRYPTION_KEY }}
          MFA_REQUIRED_FOR_ADMIN: ${{ secrets.MFA_REQUIRED_FOR_ADMIN }}

  migrate:
    name: Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:17.6.1.136
        ports: [5432]
        env:
          POSTGRES_DB: gate_monitor
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_dummy_postgres_password_123
        options: >-
          --health-cmd "pg_isready -U postgres -d gate_monitor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --no-audit --no-fund --prefer-offline
      - name: Run migrations
        run: npx tsx scripts/migrate.ts
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_dummy_postgres_password_123
          POSTGRES_DB: gate_monitor

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --no-audit --no-fund --prefer-offline
      - run: npm run test:unit

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [typecheck, lint, env, migrate]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --no-audit --no-fund --prefer-offline
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          MFA_ENROLL_SECRET: ${{ secrets.MFA_ENROLL_SECRET }}

  deploy-readiness:
    name: Deploy Readiness
    runs-on: ubuntu-latest
    needs: [typecheck, lint, env, migrate, unit, e2e]
    if: github.ref == 'refs/heads/main'
    steps:
      - run: echo "All checks passed — ready for deployment"