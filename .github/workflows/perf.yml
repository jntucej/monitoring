name: Performance guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      - name: Enforce first-load performance budget
        run: bash scripts/verify-no-heavy-first-load.sh
