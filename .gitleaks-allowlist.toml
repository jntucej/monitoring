# gitleaks v8 allowlist — suppresses VERIFIED- BENIGN findings so the secrets
# gate runs on signal, not noise. Only exact known-benign values/paths; a real
# secret anywhere else is still caught. Verified 2026-11-15.

title = "gate-monitor-benign-allowlist"

# Supabase ANON key is public-by-design (it is the "anon" role key, never secret).
[[allowlists]]
description = "Supabase anon (public) key in git history"
regex = '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJyb2xlIjoiYW5vbiJ9\.[A-Za-z0-9_-]+'''

[[allowlists]]
description = "JWTs we generate ourselves (anon role / test fixtures)"
regex = '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJyb2xlIjoiYW5vbiJ9\.[A-Za-z0-9_-]+\.'''

[[allowlists]]
description = "Removed dev-tool config key (.continue/agents/new-config.yaml, already out of HEAD)"
path = '''\.continue/'''

[[allowlists]]
description = "CI / test dummy placeholders"
regex = '''^(CI_DUMMY|DUMMY_.*|sk-dummy.*)$'''
