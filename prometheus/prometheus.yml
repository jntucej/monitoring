global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['gate_cadvisor:8080']
    metrics_path: '/metrics'



  - job_name: 'node'
    static_configs:
      - targets: ['node_exporter:9100']

  # The Next.js web app's Prometheus text exposition (api_metrics table):
  # api_requests_total / api_errors_total / api_response_time_p95_ms.
  # Backs the DevOps fleet.http_* named queries (throughput + p95 latency).
  - job_name: 'gate_web'
    static_configs:
      - targets: ['gate_web:3000']
    metrics_path: '/api/metrics'
    scrape_interval: 30s