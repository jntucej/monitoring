global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['gate_cadvisor:8080']
    metrics_path: '/metrics'

  - job_name: 'gate_web'
    static_configs:
      - targets: ['gate_web:3000']
    metrics_path: '/metrics'
    bearer_token_file: /etc/prometheus/metrics.token