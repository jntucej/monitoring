# cloudflared token-managed tunnel config.
#
# AUTH MODEL: token-managed (single model). The cloudflared container runs
#   `cloudflared tunnel run $TUNNEL_TOKEN --config /etc/cloudflared/config.yml`
# where TUNNEL_TOKEN = CLOUDFLARE_TUNNEL_TOKEN from .env (created in the
# Cloudflare dashboard). This file therefore carries ONLY the ingress/origin
# settings — no `tunnel:` UUID, no `credentials-file:`. The token authenticates
# the connector; the config defines what it routes.
#
#   - monitor.cej.in -> Caddy -> web:3000 (the public app)
#   - hooks.cej.in   -> web:3000          (Resend bounce/complaint webhooks)
#
# See RUNBOOK.md § "Cloudflare Tunnel (token-managed)" for the lifecycle.

# Ingress rules. Order matters: first match wins.
ingress:
  - hostname: monitor.cej.in
    service: http://caddy:80
  - hostname: hooks.cej.in
    service: http://web:3000
  - service: http://status:3000

# Fallthrough: everything else gets a 404 from cloudflared itself rather than
# being forwarded. Prevents accidental exposure of internal hostnames.
  - service: http://localhost:9999

# Force TCP/443 outbound. Without this, cloudflared probes QUIC (UDP 7844)
# first and flaps behind DPI-restricted ISPs. This is the single most
# important knob on a consumer line.
protocol: http2

# Don't phone home for updates mid-flight.
no-update: true

# Don't autoupdate the binary.
autoupdate: false

# 30s probe interval; if both probes fail the tunnel is marked down.
originRequest:
  http2:
    maxConnections: 100