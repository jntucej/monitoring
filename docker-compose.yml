services:
  postgres:
    image: supabase/postgres:17.6.1.136
    container_name: gate_postgres
    restart: always
    cpu_shares: 1024
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gate_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ci_dummy_postgres_password_123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gate_monitor}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gate-net

  redis:
    image: redis:7-alpine
    container_name: gate_redis
    restart: always
    cpu_shares: 768
    env_file:
      - path: .env
        required: false
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-ci_dummy_redis_password_123}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ci_dummy_redis_password_123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - gate-net

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    container_name: gate_web
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_TELEMETRY_DISABLED=1
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-gate_monitor}
      - MONITORING_PROM_URL=${MONITORING_PROM_URL:-}
      - MONITORING_LOKI_URL=${MONITORING_LOKI_URL:-}
      - MONITORING_GRAFANA_URL=${MONITORING_GRAFANA_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health | grep -q '\"database\":{\"status\":\"healthy\"\\|\"status\":\"healthy\"\\|\"status\":\"degraded\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=128m
      - /app/.next/cache:size=512m
      - /app/.cache:size=64m
      - /app/.config:size=64m
    volumes:
      - uploads_data:/app/data/uploads:rw
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      - gate-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: gate_worker
    restart: always
    cpu_shares: 256
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-gate_monitor}
      - MONITORING_PROM_URL=${MONITORING_PROM_URL:-}
      - MONITORING_LOKI_URL=${MONITORING_LOKI_URL:-}
      - MONITORING_GRAFANA_URL=${MONITORING_GRAFANA_URL:-}
      - CRON_SECRET=${CRON_SECRET:?CRON_SECRET must be set for worker}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3001/health > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      - gate-net

  caddy:
    image: caddy:2-alpine
    container_name: gate_caddy
    restart: always
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - gate-net

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
  uploads_data:

networks:
  gate-net:
    driver: bridge
