services:
  postgres:
    image: supabase/postgres:17.6.1.136
    container_name: gate_postgres
    restart: always
    cpu_shares: 1024
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gate_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production or .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gate_monitor}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gate-net

  redis:
    image: redis:7-alpine
    container_name: gate_redis
    restart: always
    cpu_shares: 768
    env_file:
      - path: .env
        required: false
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in production or .env}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in production or .env}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - gate-net

  web:
    image: monitoring-web:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    container_name: gate_web
    restart: always
    env_file:
      - path: .env
        required: false
    extra_hosts:
      # Let the container reach the host's local LLM (jcode openrouter gateway
      # on 127.0.0.1:20128) for the campus-assistant RAG/bot chat surface.
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_TELEMETRY_DISABLED=1
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-gate_monitor}
      - MONITORING_PROM_URL=${MONITORING_PROM_URL:-}
      - MONITORING_LOKI_URL=${MONITORING_LOKI_URL:-}
      - MONITORING_GRAFANA_URL=${MONITORING_GRAFANA_URL:-}
      # RAG / campus assistant (bot chat + RAG memory) — OpenAI-compatible LLM.
      # By default the web container reaches the LLM via the llm-proxy sidecar
      # (which uses host network mode to bridge UFW). Override RAG_LLM_API_URL
      # in .env to point at a different OpenAI-compatible endpoint if desired.
      - RAG_LLM_API_URL=${RAG_LLM_API_URL:-http://llm-proxy:8080/v1}
      - RAG_LLM_API_KEY=${RAG_LLM_API_KEY:-}
      - RAG_LLM_MODEL=${RAG_LLM_MODEL:-agnes-3.0-flash}
      - RAG_EMBEDDING_API_URL=${RAG_EMBEDDING_API_URL:-http://llm-proxy:8080/v1}
      - RAG_EMBEDDING_API_KEY=${RAG_EMBEDDING_API_KEY:-}
      - CRON_SECRET=${CRON_SECRET:?CRON_SECRET must be set for web}
    networks:
      gate-net:
        aliases:
          - web
          - gate_web
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      llm-proxy:
        condition: service_started

  # ---------------------------------------------------------------------------
  # llm-proxy — lightweight Node proxy that bridges the compose network to the
  # host's omniroute LLM gateway (127.0.0.1:20128). Uses host network mode
  # so it can reach 127.0.0.1 directly, bypassing the UFW FORWARD DROP that
  # blocks container→host LAN traffic on non-published ports.
  # ---------------------------------------------------------------------------
  llm-proxy:
    image: node:20-alpine
    container_name: gate_llm_proxy
    restart: always
    network_mode: host
    ports:
      # Published on 127.0.0.1 only — Docker creates a NAT rule that lets the
      # web container reach it via the published port, bypassing the UFW
      # FORWARD DROP that otherwise blocks container→host LAN traffic.
      - "127.0.0.1:8080:8080"
    command: node /app/llm-proxy.mjs
    environment:
      - LLM_PROXY_BACKEND_HOST=${LLM_PROXY_BACKEND_HOST:-127.0.0.1}
      - LLM_PROXY_BACKEND_PORT=${LLM_PROXY_BACKEND_PORT:-20128}
      - LLM_PROXY_LISTEN=0.0.0.0:8080
    volumes:
      - ./scripts/llm-proxy.mjs:/app/llm-proxy.mjs:ro
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  worker:
    image: monitoring-worker:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: gate_worker
    restart: always
    cpu_shares: 256
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-gate_monitor}
      - MONITORING_PROM_URL=${MONITORING_PROM_URL:-}
      - MONITORING_LOKI_URL=${MONITORING_LOKI_URL:-}
      - MONITORING_GRAFANA_URL=${MONITORING_GRAFANA_URL:-}
      - CRON_SECRET=${CRON_SECRET:?CRON_SECRET must be set for worker}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3001/health > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      - gate-net

  caddy:
    image: caddy:2-alpine
    container_name: gate_caddy
    restart: always
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - gate-net

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
  uploads_data:

networks:
  gate-net:
    driver: bridge
