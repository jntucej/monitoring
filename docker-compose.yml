services:
  postgres:
    image: supabase/postgres:17.6.1.136
    container_name: gate_postgres
    restart: always
    cpu_shares: 1024
    # Long-run resilience: per-container memory caps so one runaway service
    # cannot OOM-kill the whole stack (see paste #7 month-six failure mode).
    # Postgres shared_buffers is 25% of RAM; give it the largest slice.
    mem_limit: 2g
    mem_reservation: 512m
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gate_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production or .env}
      # Dedicated credential for the gate_app role (used by web/worker + healthcheck).
      # Falls back to POSTGRES_PASSWORD when unset. Rotate via scripts/rotate-db-creds.sh.
      GATE_APP_PASSWORD: ${GATE_APP_PASSWORD:-${POSTGRES_PASSWORD}}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gate_monitor}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gate-net

  redis:
    image: redis:7-alpine
    container_name: gate_redis
    restart: always
    cpu_shares: 768
    # Long-run resilience: Redis is a hot-path cache/queue; cap it so a
    # key-bloat or unbounded list cannot OOM the host.
    mem_limit: 512m
    mem_reservation: 64m
    env_file:
      - path: .env
        required: false
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in production or .env}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in production or .env}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - gate-net

  # Prometheus + cAdvisor for real container metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: gate_prometheus
    restart: always
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--log.level=warn'
    networks:
      - monitoring-net
      - gate-net
    depends_on:
      cadvisor:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 3

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    container_name: gate_cadvisor
    restart: always
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/run:/var/run
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    command: ["-logtostderr"]
    networks:
      - monitoring-net
    healthcheck:
      # cadvisor image has wget, not curl
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # migrate — one-shot ordered migration replay. Runs scripts/migrate.ts against
  # the running postgres (which auto-creates schema_migrations), blocks until
  # every database/migrations/*.sql has been applied, then exits 0. web/worker
  # depend on it with condition: service_completed_successfully so the app
  # never boots against an un-migrated database. No ports; restart: "no" so a
  # failure is visible (the app stays down) rather than silently flapping.
  # Re-runs are cheap: migrate.ts is advisory-lock guarded and idempotent, so
  # this also acts as the "catch up any missed migrations" step on every up.
  migrate:
    image: monitoring-web:latest
    container_name: gate_migrate
    working_dir: /app
    user: nextjs
    command: ["npx", "tsx", "scripts/migrate.ts"]
    env_file:
      - path: .env
        required: false
    environment:
      # The migrate runner must connect as a role that can CREATE the role &
      # grant in bootstrap (postgres superuser). The app role (gate_app) is
      # what web/worker use AFTER migrations are in.
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-gate_monitor}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD or GATE_APP_PASSWORD must be set}
      # gate_app credential so bootstrap/migrations can set the role password
      # (P0-1): the GUC is read by 20261010120000_create_app_role.sql.
      - GATE_APP_PASSWORD=${GATE_APP_PASSWORD:-${POSTGRES_PASSWORD}}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - gate-net

  web:
    image: monitoring-web:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    # Long-run resilience: cap Next.js so a runaway RSC payload or memory
    # leak in an SSE route cannot consume the whole host and OOM the stack.
    mem_limit: 1g
    mem_reservation: 256m
    container_name: gate_web
    restart: always
    env_file:
      - path: .env
        required: false
    extra_hosts:
      # Let the container reach the host's local LLM (jcode openrouter gateway
      # on 127.0.0.1:20128) for the campus-assistant RAG/bot chat surface.
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - PORT=3000
      - NEXT_TELEMETRY_DISABLED=1
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - DATABASE_URL=postgres://gate_app:${GATE_APP_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD or GATE_APP_PASSWORD must be set}}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-gate_monitor}
      - MONITORING_PROM_URL=${MONITORING_PROM_URL:-http://prometheus:9090}
      - MONITORING_LOKI_URL=${MONITORING_LOKI_URL:-}
      - MONITORING_GRAFANA_URL=${MONITORING_GRAFANA_URL:-}
      # Batch I1: Alertmanager → Telegram bridge. The webhook token is the
      # same value alertmanager.yml sends as the Bearer credential; both
      # resolve from .env.
      - ALERTMANAGER_WEBHOOK_TOKEN=${ALERTMANAGER_WEBHOOK_TOKEN:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_CRITICAL_CHAT_ID=${TELEGRAM_CRITICAL_CHAT_ID:-}
      # RAG / campus assistant (bot chat + RAG memory) — OpenAI-compatible LLM.
      # By default the web container reaches the LLM via the llm-proxy sidecar
      # (which uses host network mode to bridge UFW). Override RAG_LLM_API_URL
      # in .env to point at a different OpenAI-compatible endpoint if desired.
      - RAG_LLM_API_URL=${RAG_LLM_API_URL:-http://llm-proxy:8080/v1}
      - RAG_LLM_API_KEY=${RAG_LLM_API_KEY:-}
      - RAG_LLM_MODEL=${RAG_LLM_MODEL:-agnes-3.0-flash}
      - RAG_EMBEDDING_API_URL=${RAG_EMBEDDING_API_URL:-http://llm-proxy:8080/v1}
      - RAG_EMBEDDING_API_KEY=${RAG_EMBEDDING_API_KEY:-}
      - CRON_SECRET=${CRON_SECRET:?CRON_SECRET must be set for web}
      - KIOSK_SESSION_REQUIRE_PIN=${KIOSK_SESSION_REQUIRE_PIN:-true}
      # Batch J: drill evidence dir (J5). The host runs the drills; the web
      # container reads their signed JSON evidence. The env_file above
      # already carries DRILL_* / SYSADMIN_INTERNAL_TOKEN from .env.
      - DRILL_MODE=${DRILL_MODE:-}
      - DRILL_SECRET=${DRILL_SECRET:-}
      - DRILL_EVIDENCE_DIR=${DRILL_EVIDENCE_DIR:-/opt/monitoring/drills/evidence}
      - SYSADMIN_INTERNAL_TOKEN=${SYSADMIN_INTERNAL_TOKEN:-}
      - INTERNAL_BASE_URL=${INTERNAL_BASE_URL:-http://localhost:3000}
    networks:
      gate-net:
        aliases:
          - web
          - gate_web
      monitoring-net:
      llm-net:
    volumes:
      - uploads_data:/app/data/uploads
      # Batch J5: read-only mount of the host-side drill evidence dir so
      # /api/sysadmin/drills can enumerate the latest run per drill.
      - ${DRILL_EVIDENCE_DIR:-/opt/monitoring/drills/evidence}:/opt/monitoring/drills/evidence:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      llm-proxy:
        condition: service_started
      prometheus:
        condition: service_started
      cadvisor:
        condition: service_started
      # Batch I1: Alertmanager starts independently of web (the web hook
      # is the *receiver*, not a dependency for the container to boot).
      # Starting it here just guarantees the target is up before prometheus
      # fires the first alert; web stays the same as before.
      alertmanager:
        condition: service_started

  # ---------------------------------------------------------------------------
  # llm-proxy — lightweight Node proxy that bridges the compose network to the
  # host's omniroute LLM gateway (127.0.0.1:20128). Runs on gate-net bridge
  # with extra_hosts mapping to host gateway, publishing loopback only.
  # Governed strictly by UFW (no network_mode: host).
  # ---------------------------------------------------------------------------
  llm-proxy:
    image: node:20-alpine
    container_name: gate_llm_proxy
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - llm-net
    command: node /app/llm-proxy.mjs
    environment:
      - LLM_PROXY_BACKEND_HOST=${LLM_PROXY_BACKEND_HOST:-host.docker.internal}
      - LLM_PROXY_BACKEND_PORT=${LLM_PROXY_BACKEND_PORT:-20128}
      - LLM_PROXY_LISTEN=0.0.0.0:8080
    volumes:
      - ./scripts/llm-proxy.mjs:/app/llm-proxy.mjs:ro
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  worker:
    image: monitoring-worker:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: gate_worker
    restart: always
    cpu_shares: 256
    # Long-run resilience: worker holds a PG pool + cron jobs; cap it so a
    # leaky job or unbounded queue backlog cannot OOM the host.
    mem_limit: 512m
    mem_reservation: 128m
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - DATABASE_URL=postgres://gate_app:${GATE_APP_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD or GATE_APP_PASSWORD must be set}}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-gate_monitor}
      # Long-run resilience: the worker keeps its own PG pool, so its pool
      # size must stay within max_connections alongside the web container's
      # pool (web: PG_MAX_POOL_SIZE=20, worker: PG_MAX_POOL_SIZE=10 → 30 total,
      # well under the default max_connections=100).
      - PG_MAX_POOL_SIZE=10
      - MONITORING_PROM_URL=${MONITORING_PROM_URL:-http://prometheus:9090}
      - MONITORING_LOKI_URL=${MONITORING_LOKI_URL:-}
      - MONITORING_GRAFANA_URL=${MONITORING_GRAFANA_URL:-}
      - CRON_SECRET=${CRON_SECRET:?CRON_SECRET must be set for worker}
      # DR §7: write the last-known-good status snapshot to a named volume
      # shared with Caddy's /status static page. The Caddy container mounts
      # this volume read-only at /usr/share/status; the worker writes to
      # /usr/share/status/status-last.json every 60s.
      - STATUS_LAST_JSON=/usr/share/status/status-last.json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3001/health > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    # DR §7: the worker writes the last-known-good status snapshot here every
    # 60s. Caddy serves it read-only at /status as the fallback when web is
    # down. Without this mount the static page can only show the seed value.
    volumes:
      - status_data:/usr/share/status
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      - gate-net

  caddy:
    image: caddy:2-alpine
    container_name: gate_caddy
    restart: always
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./compose/Caddyfile:/etc/caddy/Caddyfile:ro
      - status_data:/usr/share/status:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - gate-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: gate_cloudflared
    restart: always
    # Single, token-managed model. The TUNNEL_TOKEN is the credential (no local
    # tunnel UUID, no credentials-file, no named volume at the file path). The
    # config file supplies ingress only; cloudflared pairs it with the token.
    # --protocol http2 forces TCP/443 outbound (avoids QUIC/UDP flap on
    # DPI-restricted ISPs).
    command: tunnel --no-autoupdate --protocol http2 run $TUNNEL_TOKEN --config /etc/cloudflared/config.yml
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN must be set}
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    networks:
      - gate-net
    depends_on:
      - caddy
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  alertmanager:
    image: prom/alertmanager:latest
    container_name: gate_alertmanager
    restart: always
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.listen-address=:9093'
    ports:
      - "127.0.0.1:9093:9093"
    networks: [monitoring-net, gate-net]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:9093/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
  uploads_data:
  # DR §7: shared between gate_worker (read-write, writes status-last.json
  # every 60s) and gate_caddy (read-only, serves it at /status). Seeded
  # with status.html + status-last.json at first deploy.
  status_data:
  prometheus_data:
  # Batch I1: Alertmanager durable state (firing/resolved alert groups).
  alertmanager_data:

networks:
  gate-net:
    driver: bridge
  monitoring-net:
    driver: bridge
  llm-net:
    driver: bridge
