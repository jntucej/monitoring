services:
  postgres:
    image: supabase/postgres:17.6.1.136
    container_name: gate_postgres
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gate_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gate_monitor}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gate-net

  redis:
    image: redis:7-alpine
    container_name: gate_redis
    restart: always
    env_file:
      - path: .env
        required: false
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gate-net

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: gate_web
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gate_monitor}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - MONITORING_PROM_URL=http://mon_prometheus:9090
      - MONITORING_LOKI_URL=http://mon_loki:3100
      - MONITORING_GRAFANA_URL=http://100.122.7.62:3001
      - NEXT_PUBLIC_MONITORING_GRAFANA_URL=http://100.122.7.62:3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - gate-net
      - mon-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: gate_worker
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gate_monitor}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gate-net

  caddy:
    image: caddy:2-alpine
    container_name: gate_caddy
    restart: always
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - gate-net

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:

networks:
  gate-net:
    driver: bridge

  mon-net:
    external: true
    name: server-monitoring_mon-net
