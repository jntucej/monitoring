services:
  postgres:
    image: postgres:15-alpine
    container_name: gate_postgres
    restart: always
    env_file: [.env]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gate_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gate_monitor}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gate-net

  redis:
    image: redis:7-alpine
    container_name: gate_redis
    restart: always
    env_file: [.env]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gate-net

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: gate_web
    restart: always
    env_file: [.env]
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gate_monitor}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - gate-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: gate_worker
    restart: always
    env_file: [.env]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gate_monitor}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gate-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: gate_cloudflared
    restart: always
    env_file: [.env]
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web
    networks:
      - gate-net

volumes:
  pgdata:
  redisdata:

networks:
  gate-net:
    driver: bridge
