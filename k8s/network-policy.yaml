apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gate-monitor-network-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: gate-postgres
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: gate-web
    - podSelector:
        matchLabels:
          app: gate-worker
    ports:
    - protocol: TCP
      port: 5432
