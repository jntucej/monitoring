# Kubernetes ExternalSecrets manifest for Gate Monitor
# In production clusters, syncs credentials automatically from AWS Secrets Manager,
# HashiCorp Vault, or Google Cloud Secret Manager.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gate-cluster-secret-store
spec:
  provider:
    # Example using AWS Secrets Manager or generic Vault backend
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: gate-secrets-sa
            namespace: gate-monitor
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gate-monitor-secrets
  namespace: gate-monitor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gate-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: gate-monitor-secrets
    creationPolicy: Owner
  data:
    - secretKey: postgres-password
      remoteRef:
        key: gate-monitor/prod/postgres-password
    - secretKey: redis-password
      remoteRef:
        key: gate-monitor/prod/redis-password
    - secretKey: jwt-secret
      remoteRef:
        key: gate-monitor/prod/jwt-secret
    - secretKey: auth-jwt-secret
      remoteRef:
        key: gate-monitor/prod/auth-jwt-secret
    - secretKey: cron-secret
      remoteRef:
        key: gate-monitor/prod/cron-secret
    - secretKey: qr-token-secret
      remoteRef:
        key: gate-monitor/prod/qr-token-secret
    - secretKey: mobile-token-secret
      remoteRef:
        key: gate-monitor/prod/mobile-token-secret
    - secretKey: telegram-bot-token
      remoteRef:
        key: gate-monitor/prod/telegram-bot-token
    - secretKey: telegram-chat-id
      remoteRef:
        key: gate-monitor/prod/telegram-chat-id
    - secretKey: DATABASE_URL
      remoteRef:
        key: gate-monitor/prod/database-url
    - secretKey: REDIS_URL
      remoteRef:
        key: gate-monitor/prod/redis-url
