# CIS Ubuntu 22.04 LTS v3.0.0 Benchmark - AIDE Configuration for Gate Monitor Host
# Destination: /etc/aide/aide.conf.d/99-gate-monitor
#
# Rules:
# FIPSR = p+i+n+u+g+s+m+c+acl+selinux+xattrs+sha256

# Full integrity check on system configuration and executables
/etc    FIPSR
/bin    FIPSR
/sbin   FIPSR
/usr/bin FIPSR
/usr/sbin FIPSR
/opt/monitoring/compose  FIPSR
/opt/monitoring/scripts  FIPSR

# Detect-only for logs (avoids churn from logrotate)
/var/log  p

# CRITICAL EXCLUSIONS: Docker overlays & runtime directories that flood AIDE reports
!/var/lib/docker
!/var/lib/containerd
!/opt/monitoring/backups
!/opt/monitoring/logs
!/proc
!/sys
!/dev
!/tmp
!/var/tmp
