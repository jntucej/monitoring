# Control 4: pgaudit configuration for PostgreSQL
# Targeted audit logging: DDL + role changes + write operations on sensitive tables
# Overhead: <1% (avoids the "pgaudit.log = 'all'" performance trap)

shared_preload_libraries = 'pgaudit'

# Log DDL statements (CREATE/ALTER/DROP) and ROLE operations (GRANT/REVOKE/CREATE ROLE)
pgaudit.log = 'ddl, role, write'

# Log relation names
pgaudit.log_relation = on

# Do not log system catalog statements to keep log volume minimal
pgaudit.log_catalog = off

# Capture bound parameters for SQL injection forensics
pgaudit.log_parameter = on

# Log level
pgaudit.log_level = 'log'
