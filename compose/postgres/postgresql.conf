# postgresql.conf — production hardening for gate_postgres
# Mounted read-only into the Postgres container via docker-compose.yml.
# Supabase image uses /var/lib/postgresql/data/postgresql.conf by default;
# this file overrides the stock config with a locked-down set.

# ── Logging ──────────────────────────────────────────────────────────
# Log to stderr (captured by docker log) rather than a file in /var/lib/postgresql/data
# (where a single chatty session can fill the PGDATA volume and take the DB down).
log_destination = 'stderr'

# log_statement=none: do NOT dump every DML statement to the log.
# The application maintains its own audit_logs table for that purpose.
log_statement = 'none'

# Log only connection events and slow queries.
log_connections = on
log_disconnections = on

# Warn on queries that exceed 500 ms — helps spot missing indexes.
log_min_duration_statement = 500

# Log duration of all slow statements (including in autocommit mode)
log_lock_waits = on
log_temp_files = 0

# ── Security ─────────────────────────────────────────────────────────
# Require SCRAM-SHA-256 for all host connections (no md5, no plain).
# Applied to existing users via scripts/rotate-db-creds.sh.
# SCRAM enforcement happens in pg_hba.conf (supplied by the supabase image).

# ── Performance ─────────────────────────────────────────────────────
# Sizing: shared_buffers = 25% of the 2 GB container memory cap = 512 MB.
# For a 2 GB container on a shared host, effective_cache_size = 1 GB
# (Postgres can leverage the OS page cache for its read-ahead).
shared_buffers = 512MB
effective_cache_size = 1GB
work_mem = 4MB                 # per-sort, per-hash-join work area
maintenance_work_mem = 64MB
max_wal_size = 256MB
checkpoint_timeout = 15min

# ── Connections ─────────────────────────────────────────────────────
# The K8s / docker-compose pool budget check (checkPoolBudget) enforces
# per-replica pool size × replicas < 80% of this value.
max_connections = 100

# ── Timezone ────────────────────────────────────────────────────────
# IST (Asia/Kolkata, UTC+05:30) — all timestamp comparisons in the app
# use this zone; keep it consistent with the app's date helpers.
timezone = 'Asia/Kolkata'

# ── Shared Preload ───────────────────────────────────────────────────
# Supabase image ships autovacuum tuning; keep the stock preload list
# (supabase is configured via its own config layer on top of this).
