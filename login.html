<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | JNTUH University College of Engineering, Nachupally</title>
  <meta name="description" content="Login to the JNTUHCEJ portal — access student, faculty, admin, and parent dashboards.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%237C3AED'/><text x='50' y='68' font-size='52' font-family='Inter,sans-serif' font-weight='700' fill='white' text-anchor='middle'>J</text></svg>">
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0F172A 0%, #1E1B4B 60%, #4C1D95 100%);
      padding: var(--sp-6);
      position: relative;
      overflow: hidden;
    }
    .login-page::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 80% 20%, rgba(124,58,237,0.3), transparent 50%);
    }
    .login-card {
      position: relative;
      z-index: 2;
      background: var(--white);
      border-radius: 24px;
      padding: var(--sp-12);
      width: 100%;
      max-width: 440px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.4);
    }
    .login-card .login-logo {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      margin-bottom: var(--sp-8);
    }
    .login-card .login-logo img {
      width: 48px;
      height: 48px;
      border-radius: 10px;
    }
    .login-card .login-logo strong { font-size: 1rem; display: block; }
    .login-card .login-logo span { font-size: 0.75rem; color: var(--text-secondary); }
    .login-card h1 { margin-bottom: var(--sp-2); }
    .login-card .login-sub { color: var(--text-secondary); margin-bottom: var(--sp-8); }
    .role-select {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--sp-2);
      margin-bottom: var(--sp-6);
    }
    .role-btn {
      padding: var(--sp-3) var(--sp-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-align: center;
      transition: all var(--ease);
      background: var(--white);
    }
    .role-btn:hover { border-color: var(--accent); color: var(--accent); }
    .role-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }
    .login-form { display: grid; gap: var(--sp-4); }
    .login-form .form-row { display: grid; gap: var(--sp-1); }
    .login-form label { font-size: 0.75rem; font-weight: 600; color: var(--text-primary); }
    .login-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
    }
    .login-options a { color: var(--accent); font-weight: 600; }
    .login-options a:hover { text-decoration: underline; }
    .login-back {
      display: block;
      text-align: center;
      margin-top: var(--sp-6);
      font-size: 0.75rem;
      color: var(--text-secondary);
    }
    .login-back a { color: var(--accent); font-weight: 600; }
    .login-back a:hover { text-decoration: underline; }
    @media (max-width: 640px) {
      .login-card { padding: var(--sp-8) var(--sp-6); }
    }
  </style>
</head>
<body>

  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <img src="https://jntuhcej.ac.in/images/logo.png" alt="JNTUHCEJ Logo" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%237C3AED%22/><text x=%2250%22 y=%2268%22 font-size=%2252%22 font-family=%22Inter,sans-serif%22 font-weight=%22700%22 fill=%22white%22 text-anchor=%22middle%22>J</text></svg>'">
        <div>
          <strong>JNTUHCEJ Portal</strong>
          <span>Nachupally (Kondagattu)</span>
        </div>
      </div>

      <h1 class="h2">Welcome Back</h1>
      <p class="login-sub">Sign in to access your dashboard.</p>

      <div class="role-select" id="roleSelect">
        <button class="role-btn active" data-role="Student">🎓<br>Student</button>
        <button class="role-btn" data-role="Faculty">👨‍🏫<br>Faculty</button>
        <button class="role-btn" data-role="Admin">🛡️<br>Admin</button>
        <button class="role-btn" data-role="Security">🛂<br>Security</button>
        <button class="role-btn" data-role="CR">📋<br>CR</button>
        <button class="role-btn" data-role="Parent">👨‍👩‍👧<br>Parent</button>
      </div>

      <form class="login-form" onsubmit="event.preventDefault(); alert('Login functionality will be connected to the backend.');">
        <div class="form-row">
          <label for="username">Username / Roll Number</label>
          <input type="text" id="username" class="input" placeholder="Enter your username" required>
        </div>
        <div class="form-row">
          <label for="password">Password</label>
          <input type="password" id="password" class="input" placeholder="Enter your password" required>
        </div>
        <div class="login-options">
          <label style="display: flex; align-items: center; gap: var(--sp-1);">
            <input type="checkbox" style="accent-color: var(--accent);"> Remember me
          </label>
          <a href="#">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-lg">Sign In</button>
      </form>

      <div class="login-back">
        <a href="index.html">← Back to Homepage</a>
      </div>
    </div>
  </div>

  <script>
    // Role selection
    document.querySelectorAll('.role-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
  </script>
</body>
</html>
