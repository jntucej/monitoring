# Gate 6 — Human Sign-Off Record (evidence package). Filled by the validation agent.
# The APPROVAL itself must be applied by a NAMED HUMAN. Do not self-approve.
#
# To approve: a human edits the block below, sets status: approved, fills
# approver + timestamp + file_hash, commits it. The pipeline is complete only when
# this file shows status: approved against the exact commit hash.

release:
  # Approve the HEAD of main as of sign-off. Key release commits (all pushed):
  #   bc1d5096  SCA fixes (next 16.4.1, nodemailer 10.5.0, source-map-js 1.2.2) -> trivy 0 HIGH/CRITICAL
  #   c851113b  verified-runnable k6 gate script (5 latent defects fixed)
  #   8f8212e0  semgrep SAST gate (16 FPs reviewed+suppressed) + artifact
  #   857bd363  current tip (this record + docs)
  approve: HEAD-of-main-as-of-signoff
  repo: jntucej/monitoring.git
  branch: main
  target: https://monitor.ucej.in

evidence_package:
  gate1_load:        load/k6-gate.mjs            # written, thresholds in-script; NOT executed (prod, deferred)
  gate2_secrets:     release-evidence/985c30db/gitleaks-history.json   # 1503 commits, allowlisted → exit 0
  gate2_sca:         release-evidence/985c30db/sca-trivy.json         # 0 HIGH/CRITICAL, trivy exit 0
  gate2_sast:        scripts/check-security.sh   # PASS (repo invariant SAST; semgrep binary pending network)
  gate2_dast:        security/zap-gate.md        # command staged; NOT executed (prod, deferred)
  gate3_a11y:        Playwright a11y.spec.ts      # 9/9, 0 critical/serious (axe-core)
  gate3_visual:      tests/ui-all-roles.spec.ts   # functional journey PASS; screenshot baselines stale-vs-prod (inconclusive, not a defect)
  gate4_tests:       vitest 12/12 + jest 150/150 + test:ci 19/19     # all PASS
  gate4_migration:   up PASS + rollback PASS (simulated break kept old image; site stayed 200)
  gate4_smoke:       health 200/0.27s, root boots, admin login 200    # PASS
  gate5_readiness:   docs/release-readiness-985c30db.md              # aggregated go/no-go

gate_status:
  G1_traffic_load:      DEFERRED_PROD   # Tier-2; k6 script ready; needs human to run / provide staging
  G2a_secrets:          PASS            # Tier-1 (allowlist in .gitleaks-allowlist.toml)
  G2b_sca:              PASS            # Tier-1 (next 16.4.1, nodemailer 10.5.0, source-map-js 1.2.2)
  G2c_sast:             PASS            # Tier-1; semgrep 1.185.0, 16 FPs reviewed+suppressed, 0 findings, exit 0
  G2d_dast:             DEFERRED_PROD   # Tier-1; ZAP command staged; needs human go-ahead / staging
  G3_ui_a11y:           PASS            # Tier-2 (axe 0 critical/serious); visual-reg inconclusive vs prod
  G4_functional:        PASS            # Tier-1 (all suites + migration up/rollback + smoke)
  G5_readiness:         CONDITIONAL_GO  # Tier-1; 2 prod-touching gates deferred to human
  G6_signoff:           PENDING_HUMAN   # Tier-1; this record; human must approve the commit hash

open_warn_items:
  - gate: G1
    item: "Load test not run against prod (no staging env). 200-VU headroom unverified."
    owner: release-engineer
    mitigation: "Run k6 run load/k6-gate.mjs in a low-traffic window, or stand up a staging clone."
  - gate: G2d
    item: "ZAP DAST not run against prod (active scanner = WAF/lockout risk)."
    owner: security
    mitigation: "Point ZAP at a staging clone, or approve a scoped public-surface scan per security/zap-gate.md."
  - gate: G3
    item: "Screenshot baselines (2026-11-04) predate this session's UI changes; spec's request-API login doesn't share cookies with the screenshot page against prod → captures /login."
    owner: qa
    mitigation: "Run the screenshot suite in CI (webServer shares the session); do NOT regenerate baselines from the prod capture."

approval:
  status: PENDING_HUMAN   # human must change to: approved
  approver: ""            # human: name (required)
  timestamp: ""           # human: ISO-8601 (required)
  notes: "Agent assembled this package. No deploy/merge/sign-off occurs until a named human sets status: approved. See release-evidence/ for the current commit hash + tree."
